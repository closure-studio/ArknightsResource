name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        uses: repo-sync/github-sync@v2
        with:
          source_repo: fexli/ArknightsResource
          source_branch: main
          destination_branch: main
          github_token: ${{ secrets.MY_TOKEN }}
