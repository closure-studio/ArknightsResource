name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check available space
        run: df -h
      
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # 发送开始部署通知
      - name: Send Deployment Start Notification
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl --request POST \
            --url ${{ secrets.QQBOT_URL }} \
            --header 'Content-Type: application/json' \
            --data "{
              \"token\": \"${{ secrets.QQBOT_TOKEN }}\",
              \"uid\": ${{ secrets.QQBOT_UID }},
              \"msg\": \"【ArknightsResource】\\n 🚀 开始部署\\n分支: ${{ github.ref_name }}\\nCommit: ${GITHUB_SHA:0:7}\\n作者: ${{ github.actor }}\\n消息: ${COMMIT_MSG}\"
            }"
          
      - name: Prepare deploy directory
        run: |
          mkdir deploy
          cp -r charpack deploy/
          cp -r charpor deploy/
          cp -r equip deploy/
          cp -r gacha deploy/
          cp -r items deploy/
          cp -r avatar deploy/
          cp -r skills deploy/
          cp -r rogueitem deploy/
          echo "Deploy directory content:"
          ls -al deploy
      
      # Cloudflare Pages deploy
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: arkresource
          directory: deploy
      
      # 发送部署成功通知
      - name: Send Deployment Success Notification
        if: success()
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl --request POST \
            --url ${{ secrets.QQBOT_URL }} \
            --header 'Content-Type: application/json' \
            --data "{
              \"token\": \"${{ secrets.QQBOT_TOKEN }}\",
              \"uid\": ${{ secrets.QQBOT_UID }},
              \"msg\": \"【ArknightsResource】\\n✅ 部署成功\\n分支: ${{ github.ref_name }}\\nCommit: ${GITHUB_SHA:0:7}\\n作者: ${{ github.actor }}\\n消息: ${COMMIT_MSG}\"
            }"
          
      # 发送部署失败通知
      - name: Send Deployment Failure Notification
        if: failure()
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl --request POST \
            --url ${{ secrets.QQBOT_URL }} \
            --header 'Content-Type: application/json' \
            --data "{
              \"token\": \"${{ secrets.QQBOT_TOKEN }}\",
              \"uid\": ${{ secrets.QQBOT_UID }},
              \"msg\": \"【ArknightsResource】\\n❌ 部署失败\\n分支: ${{ github.ref_name }}\\nCommit: ${GITHUB_SHA:0:7}\\n作者: ${{ github.actor }}\\n消息: ${COMMIT_MSG}\\n日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
