name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check available space
        run: df -h
      
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # 发送开始部署通知
      - name: Send deploy start notification
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          JSON_BODY=$(jq -n \
            --arg token "${{ secrets.DEPLOY_NOTIFY_TOKEN }}" \
            --arg uid "${{ secrets.DEPLOY_NOTIFY_UID }}" \
            --arg msg "🚀 开始部署
          分支: ${{ github.ref_name }}
          Commit: ${GITHUB_SHA:0:7}
          作者: ${{ github.actor }}
          消息: ${COMMIT_MSG}" \
            '{token: $token, uid: ($uid|tonumber), msg: $msg}')
          echo "Sending start notification:"
          echo "$JSON_BODY"
          curl --request POST \
            --url "${{ secrets.DEPLOY_NOTIFY_URL }}" \
            --header "Content-Type: application/json" \
            --data "$JSON_BODY"
      
      - name: Prepare deploy directory
        run: |
          mkdir deploy
          cp -r charpack deploy/
          cp -r charpor deploy/
          cp -r equip deploy/
          cp -r gacha deploy/
          cp -r items deploy/
          cp -r avatar deploy/
          cp -r skills deploy/
          cp -r rogueitem deploy/
          echo "Deploy directory content:"
          ls -al deploy
      
      # Cloudflare Pages deploy
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: arkresource
          directory: deploy
      
      # 发送部署成功通知
      - name: Send deploy success notification
        if: success()
        run: |
          DEPLOY_URL="https://arkresource.pages.dev"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          JSON_BODY=$(jq -n \
            --arg token "${{ secrets.DEPLOY_NOTIFY_TOKEN }}" \
            --arg uid "${{ secrets.DEPLOY_NOTIFY_UID }}" \
            --arg msg "✅ 部署成功
          分支: ${{ github.ref_name }}
          Commit: ${GITHUB_SHA:0:7}
          作者: ${{ github.actor }}
          消息: ${COMMIT_MSG}
          🔗 URL: ${DEPLOY_URL}" \
            '{token: $token, uid: ($uid|tonumber), msg: $msg}')
          echo "Sending success notification:"
          echo "$JSON_BODY"
          curl --request POST \
            --url "${{ secrets.DEPLOY_NOTIFY_URL }}" \
            --header "Content-Type: application/json" \
            --data "$JSON_BODY"
      
      # 发送部署失败通知
      - name: Send deploy failure notification
        if: failure()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          JSON_BODY=$(jq -n \
            --arg token "${{ secrets.DEPLOY_NOTIFY_TOKEN }}" \
            --arg uid "${{ secrets.DEPLOY_NOTIFY_UID }}" \
            --arg msg "❌ 部署失败
          分支: ${{ github.ref_name }}
          Commit: ${GITHUB_SHA:0:7}
          作者: ${{ github.actor }}
          消息: ${COMMIT_MSG}" \
            '{token: $token, uid: ($uid|tonumber), msg: $msg}')
          echo "Sending failure notification:"
          echo "$JSON_BODY"
          curl --request POST \
            --url "${{ secrets.DEPLOY_NOTIFY_URL }}" \
            --header "Content-Type: application/json" \
            --data "$JSON_BODY"
