name: Deploy to Cloudflare R2
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check available space
        run: df -h
      
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # 发送开始部署通知
      - name: Send Deployment Start Notification
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl --request POST \
            --url ${{ secrets.DEPLOY_NOTIFY_URL }} \
            --header 'Content-Type: application/json' \
            --data "{
              \"token\": \"${{ secrets.DEPLOY_NOTIFY_TOKEN }}\",
              \"uid\": ${{ secrets.DEPLOY_NOTIFY_UID }},
              \"msg\": \"【ArknightsResource】\\n 🚀 开始部署\\n分支: ${{ github.ref_name }}\\nCommit: ${GITHUB_SHA:0:7}\\n作者: ${{ github.actor }}\\n消息: ${COMMIT_MSG}\"
            }"
          
      - name: Prepare deploy directory
        run: |
          mkdir deploy
          cp -r charpack deploy/
          cp -r charpor deploy/
          cp -r equip deploy/
          cp -r gacha deploy/
          cp -r items deploy/
          cp -r avatar deploy/
          cp -r skills deploy/
          cp -r rogueitem deploy/
          echo "Deploy directory content:"
          ls -al deploy
          echo "Deploy directory size before WebP conversion:"
          du -sh "deploy"

      - name: Install deploy tools
        run: |
          NEED_UPDATE=0

          if ! command -v aws >/dev/null 2>&1; then
            NEED_UPDATE=1
          fi

          if ! command -v cwebp >/dev/null 2>&1; then
            NEED_UPDATE=1
          fi

          if [ "$NEED_UPDATE" -eq 1 ]; then
            sudo apt-get update
          fi

          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get install -y awscli
          fi

          if ! command -v cwebp >/dev/null 2>&1; then
            sudo apt-get install -y webp
          fi

          aws --version
          cwebp -version

      - name: Convert images to WebP
        run: |
          find "deploy" -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -print0 | \
          while IFS= read -r -d '' file; do
            output="${file%.*}.webp"
            before_size=$(stat -c%s "$file")
            cwebp -quiet -q 80 "$file" -o "$output"
            after_size=$(stat -c%s "$output")
            echo "Converted: $file -> $output | before=${before_size}B after=${after_size}B"
            rm -f "$file"
          done

          echo "Remaining image files in deploy:"
          find "deploy" -type f \( -iname "*.webp" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | sort
          echo "Deploy directory size after WebP conversion:"
          du -sh "deploy"

      # Cloudflare R2 deploy
      - name: Deploy to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync "deploy" "s3://${{ secrets.CLOUDFLARE_R2_BUCKET }}" \
            --endpoint-url "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --delete
      
      # 发送部署成功通知
      - name: Send Deployment Success Notification
        if: success()
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl --request POST \
            --url ${{ secrets.DEPLOY_NOTIFY_URL }} \
            --header 'Content-Type: application/json' \
            --data "{
              \"token\": \"${{ secrets.DEPLOY_NOTIFY_TOKEN }}\",
              \"uid\": ${{ secrets.DEPLOY_NOTIFY_UID }},
              \"msg\": \"【ArknightsResource】\\n✅ 部署成功\\n分支: ${{ github.ref_name }}\\nCommit: ${GITHUB_SHA:0:7}\\n作者: ${{ github.actor }}\\n消息: ${COMMIT_MSG}\"
            }"
          
      # 发送部署失败通知
      - name: Send Deployment Failure Notification
        if: failure()
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n 1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl --request POST \
            --url ${{ secrets.DEPLOY_NOTIFY_URL }} \
            --header 'Content-Type: application/json' \
            --data "{
              \"token\": \"${{ secrets.DEPLOY_NOTIFY_TOKEN }}\",
              \"uid\": ${{ secrets.DEPLOY_NOTIFY_UID }},
              \"msg\": \"【ArknightsResource】\\n❌ 部署失败\\n分支: ${{ github.ref_name }}\\nCommit: ${GITHUB_SHA:0:7}\\n作者: ${{ github.actor }}\\n消息: ${COMMIT_MSG}\\n日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
