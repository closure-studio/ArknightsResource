name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check available space
        run: df -h

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare deploy directory
        run: |
          mkdir deploy
          cp -r charpack deploy/
          cp -r charpor deploy/
          cp -r equip deploy/
          cp -r gacha deploy/
          cp -r items deploy/
          cp -r avatar deploy/
          cp -r skills deploy/
          cp -r rogueitem deploy/
          echo "Deploy directory content:"
          ls -al deploy

      # Cloudflare Pages deploy
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: arkresource
          directory: deploy   # 只上传 deploy 目录

      # 只有 success 才发送通知
      - name: Send deploy success notification
        if: success()
        run: |
          DEPLOY_URL="https://arkresource.pages.dev"
          COMMIT_SHA="${GITHUB_SHA}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.username }}"

          # 生成 JSON (保证格式正确)
          JSON_BODY=$(jq -n \
            --arg token "${{ secrets.DEPLOY_NOTIFY_TOKEN }}" \
            --arg uid "${{ secrets.DEPLOY_NOTIFY_UID }}" \
            --arg msg "Deploy Success\nURL: ${DEPLOY_URL}\nCommit: ${COMMIT_SHA}\nAuthor: ${COMMIT_AUTHOR}\nMessage: ${COMMIT_MESSAGE}" \
            '{token: $token, uid: ($uid|tonumber), msg: $msg }')

          echo "Sending JSON:"
          echo "$JSON_BODY"

          curl --request POST \
            --url "${{ secrets.DEPLOY_NOTIFY_URL }}" \
            --header "Content-Type: application/json" \
            --data "$JSON_BODY"
