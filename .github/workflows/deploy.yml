name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check available space
        run: df -h

      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare deploy directory
        run: |
          mkdir deploy
          cp -r charpack deploy/
          cp -r charpor deploy/
          cp -r equip deploy/
          cp -r gacha deploy/
          cp -r items deploy/
          cp -r avatar deploy/
          cp -r skills deploy/
          cp -r rogueitem deploy/
          echo "Deploy directory content:"
          ls -al deploy

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: arkresource
          directory: deploy   # 只上传 deploy 目录
