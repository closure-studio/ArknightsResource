name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # 或你的默认分支
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # 这些工具通常不需要，可以删除
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Check available space
        run: |
          echo "清理后的磁盘空间："
          df -h
      
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 只拉取最新 commit
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: arknights-resource  # 改成你的项目名
          directory: .  # 部署根目录
          gitHubToken: ${{ secrets.MY_TOKEN }}
